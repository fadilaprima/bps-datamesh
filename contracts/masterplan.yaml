openapi: 3.0.3
info:
  title: Data Mesh DTSEN- SKRIPSI
  description: |
    Dokumentasi API Final untuk Arsitektur Data Mesh BPS.
    Mendukung sinkronisasi otomatis antara Core Domain dan 8 Supporting/Generic Domains.
  version: 1.0.0

servers:
  - url: 'http://datamesh.eastasia.cloudapp.azure.com:{port}/api/v1'
    description: Production Server (Azure VM)
    variables:
      port:
        default: '8000'
        description: Port masing-masing microservice
        enum:
          - '8000' # Core Domain (Social Economy Aggregator)
          - '8081' # Kependudukan
          - '8082' # Pendidikan
          - '8083' # Wilayah
          - '8084' # Kesehatan
          - '8085' # Ketenagakerjaan
          - '8086' # Kesejahteraan
          - '8087' # Hunian
          - '8088' # Energi
  - url: 'http://localhost:{port}/api/v1'
    description: Local Development Server
    variables:
      port:
        default: '8000'

paths:
  # ==========================================
  # 1. METADATA MANAGEMENT
  # ==========================================
  /domains/{domain}/schemas/latest:
    parameters:
      - $ref: '#/components/parameters/DomainParam'
    get:
      summary: (UC-05) Lihat Detail Skema Aktif
      tags: [Metadata]
      responses:
        '200': {description: OK}
  
  /domains/{domain}/schemas:
    parameters:
      - $ref: '#/components/parameters/DomainParam'
    post:
      summary: (UC-04) Register Skema Baru
      tags: [Metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaRequest'
      responses:
        '201': {description: Created}

  # ==========================================
  # 2. DATA INGESTION PIPELINE
  # ==========================================
  /domains/{domain}/submissions:
    parameters:
      - $ref: '#/components/parameters/DomainParam'
    post:
      summary: (UC-07) Ingest Data (CSV/Parquet/JSON)
      tags: [Ingestion]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document: {type: string, format: binary, description: "File data (CSV/Parquet)"}
                source_id: {type: string, example: "1", description: "ID Wali Data"}
                reference_date: {type: string, format: date, example: "2026-02-17"}
      responses:
        '200': {description: Ingestion Finished}

  /domains/{domain}/validation/{identifier}:
    parameters:
      - $ref: '#/components/parameters/DomainParam'
      - $ref: '#/components/parameters/IdentifierParam'
    get:
      summary: (UC-08) Cek Status Validasi (Audit Status)
      tags: [Tracking]
      responses:
        '200': {description: OK}

  /domains/{domain}/scoring/{identifier}:
    parameters:
      - $ref: '#/components/parameters/DomainParam'
      - $ref: '#/components/parameters/IdentifierParam'
    get:
      summary: (UC-09) Cek Trust Score & Kualitas
      tags: [Tracking]
      responses:
        '200': {description: OK}

  /domains/{domain}/progress/{identifier}:
    parameters:
      - $ref: '#/components/parameters/DomainParam'
      - $ref: '#/components/parameters/IdentifierParam'
    get:
      summary: Cek Progres Sinkronisasi Database
      tags: [Tracking]
      responses:
        '200': {description: OK}

  # ==========================================
  # 3. DATASET MAINTENANCE (CRUD)
  # ==========================================
  /domains/{domain}/datasets:
    parameters:
      - $ref: '#/components/parameters/DomainParam'
    get:
      summary: (UC-10) Katalog Golden Record Aktif
      tags: [Dataset]
      parameters:
        - in: query
          name: fields
          schema: {type: string}
          description: "Comma-separated list of fields to return"
      responses:
        '200': {description: OK}

  /domains/{domain}/datasets/{identifier}:
    parameters:
      - $ref: '#/components/parameters/DomainParam'
      - $ref: '#/components/parameters/IdentifierParam'
    get:
      summary: (UC-11) Detail Record Spesifik
      tags: [Dataset]
      responses:
        '200': {description: OK}
    put:
      summary: (UC-12) Koreksi Nilai Manual (SCD Type 2)
      tags: [Dataset]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Kirim payload sesuai skema domain masing-masing"
      responses:
        '200': {description: Updated & Versioned}
    delete:
      summary: (UC-13) Soft Delete Record
      tags: [Dataset]
      responses:
        '200': {description: Soft Deleted}

  # ==========================================
  # 4. GOVERNANCE & AUDIT LOGIC
  # ==========================================
  /domains/{domain}/audit/samples:
    parameters:
      - $ref: '#/components/parameters/DomainParam'
    get:
      summary: (UC-14) Request Sampel PENDING Audit
      tags: [Governance]
      parameters:
        - in: query
          name: limit
          schema: {type: integer, default: 10}
      responses:
        '200': {description: OK}

  /domains/{domain}/audit/decision:
    parameters:
      - $ref: '#/components/parameters/DomainParam'
    post:
      summary: (UC-15) Kirim Keputusan Audit (Bulk)
      tags: [Governance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifiers: 
                  type: array
                  items: {type: string}
                  description: "Array NIK, NoKK, atau Kode Desa"
                verdict: 
                  type: integer
                  enum: [1, 2]
                  description: "1 untuk VALID, 2 untuk INVALID"
      responses:
        '200': {description: Verdict Saved}

  # ==========================================
  # 5. CORE DOMAIN (SOCIAL ECONOMY)
  # ==========================================
  /social-economy/registry:
    get:
      summary: (UC-18) Lihat Daftar Domain Mesh
      tags: [Infrastructure - Core]
      responses:
        '200': {description: OK}

  /social-economy/profil-lengkap/{nik}:
    parameters:
      - name: nik
        in: path
        required: true
        schema: {type: string}
        example: "3518xxxxxxxxxxxx"
    get:
      summary: (UC-19) Profil Terpadu (Data Stitching)
      tags: [Consumption - Core]
      responses:
        '200': {description: OK}

components:
  parameters:
    DomainParam:
      name: domain
      in: path
      required: true
      schema: 
        type: string
        enum: [kependudukan, pendidikan, ketenagakerjaan, kesejahteraan, kesehatan, hunian, energi, wilayah]
    IdentifierParam:
      name: identifier
      in: path
      required: true
      schema: {type: string}
      description: "NIK (16 digit), NoKK (16 digit), atau Kode Desa MFD"

  schemas:
    SchemaRequest:
      type: object
      properties:
        domain: {type: string}
        definition: 
          type: object
          description: "JSON Rules/Aturan Metadata"